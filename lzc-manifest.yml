usage: |
  使用自己的账号和主密码登录密码库。
  管理面板使用安装时设置的“管理员 Key”，与用户主密码不同。
  数据持久保存在 /lzcapp/var/data；升级前请备份该目录。
application:
  background_task: true
  subdomain: vaultwarden
  entries:
    - id: vault
      title: 密码库
      path: /#/login
    - id: admin
      title: 管理面板
      path: /admin
      prefix_domain: admin
  routes:
    - /=http://web.cloud.lazycat.app.vaultwarden.lzcapp:80
  # Native Bitwarden clients need the application APIs without a LazyCat
  # browser-login redirect. Vaultwarden still enforces its own authentication.
  public_path:
    - /
  depends_on:
    - web
services:
  web:
    # The approved 1.37.0 LPK's origin_hash matches this official amd64 image.
    # upstream: docker.io/vaultwarden/server:1.37.4@sha256:2bb2e0344616c62a6d76ea10558497499f8ed3f731400e143dc7bf17b757b5b9
    image: registry.lazycat.cloud/peter/vaultwarden/server:aa5d0531862fb9ca
    environment:
      # Preserve the existing signup policy and installation parameter ID.
      - SIGNUPS_ALLOWED=true
      - 'ADMIN_TOKEN={{ .U.admin_token }}'
      - 'DOMAIN=https://{{ .S.AppDomain }}'
    binds:
      # Never rename this directory: upgrades must reuse users, encrypted
      # vaults, attachments, config.json and the original RSA signing keys.
      - /lzcapp/var/data:/data
